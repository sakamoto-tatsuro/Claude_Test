<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タスク管理アプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ヘッダー：タイトル + ダークモード切替 -->
  <header class="header">
    <h1 class="header__title">📋 タスク管理</h1>
    <button id="darkModeToggle" class="btn btn--icon" aria-label="ダークモード切替">🌙</button>
  </header>

  <main class="container">

    <!-- タスク追加フォーム -->
    <section class="card" aria-label="タスク追加">
      <h2 class="card__title">タスクを追加</h2>

      <div class="form">
        <!-- タスク名 -->
        <div class="form__group form__group--full">
          <label class="form__label" for="taskInput">タスク名 <span class="required">*</span></label>
          <input
            id="taskInput"
            class="form__input"
            type="text"
            placeholder="例：資料を作成する"
            maxlength="100"
          />
        </div>

        <!-- 締切日 -->
        <div class="form__group">
          <label class="form__label" for="dueDateInput">締切日</label>
          <input
            id="dueDateInput"
            class="form__input"
            type="date"
          />
        </div>

        <!-- 優先度 -->
        <div class="form__group">
          <label class="form__label" for="priorityInput">優先度</label>
          <select id="priorityInput" class="form__select">
            <option value="high">🔴 高</option>
            <option value="medium" selected>🟡 中</option>
            <option value="low">🟢 低</option>
          </select>
        </div>

        <!-- 追加ボタン -->
        <div class="form__group form__group--full">
          <button id="addTaskBtn" class="btn btn--primary btn--full">
            ＋ タスクを追加
          </button>
        </div>
      </div>
    </section>

    <!-- 検索・フィルターエリア -->
    <section class="toolbar" aria-label="検索とフィルター">
      <!-- 検索バー -->
      <div class="toolbar__search">
        <span class="toolbar__search-icon">🔍</span>
        <input
          id="searchInput"
          class="form__input toolbar__input"
          type="text"
          placeholder="タスクを検索..."
        />
      </div>

      <!-- フィルターボタン -->
      <div class="toolbar__filters" role="group" aria-label="フィルター">
        <button class="btn btn--filter active" data-filter="all">すべて</button>
        <button class="btn btn--filter" data-filter="active">未完了</button>
        <button class="btn btn--filter" data-filter="completed">完了済み</button>
      </div>
    </section>

    <!-- タスク統計 -->
    <div class="stats" id="stats">
      <span id="statsText">タスク: 0件</span>
    </div>

    <!-- タスクリスト -->
    <section aria-label="タスク一覧">
      <ul id="taskList" class="task-list">
        <!-- タスクはapp.jsが動的に生成 -->
      </ul>

      <!-- タスクがない時の表示 -->
      <div id="emptyState" class="empty-state" hidden>
        <p class="empty-state__text">タスクがありません</p>
        <p class="empty-state__sub">上のフォームからタスクを追加しましょう！</p>
      </div>
    </section>

  </main>

  <!-- 編集モーダル -->
  <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-label="タスク編集" hidden>
    <div class="modal__overlay" id="modalOverlay"></div>
    <div class="modal__content card">
      <h2 class="card__title">タスクを編集</h2>

      <div class="form">
        <div class="form__group form__group--full">
          <label class="form__label" for="editTaskInput">タスク名</label>
          <input id="editTaskInput" class="form__input" type="text" maxlength="100" />
        </div>

        <div class="form__group">
          <label class="form__label" for="editDueDateInput">締切日</label>
          <input id="editDueDateInput" class="form__input" type="date" />
        </div>

        <div class="form__group">
          <label class="form__label" for="editPriorityInput">優先度</label>
          <select id="editPriorityInput" class="form__select">
            <option value="high">🔴 高</option>
            <option value="medium">🟡 中</option>
            <option value="low">🟢 低</option>
          </select>
        </div>

        <div class="form__group form__group--full form__group--actions">
          <button id="editCancelBtn" class="btn btn--secondary">キャンセル</button>
          <button id="editSaveBtn" class="btn btn--primary">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
